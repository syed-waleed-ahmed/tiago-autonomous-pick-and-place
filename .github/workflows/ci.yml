name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    name: Syntax and manifest checks
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install check dependencies
        run: python -m pip install --quiet pyyaml

      - name: Compile all Python sources
        run: |
          python -m compileall -q tiago_exam/scripts tiago_exam/launch

      - name: Validate package manifest
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('tiago_exam/package.xml'); print('package.xml OK')"

      - name: Validate YAML configuration
        run: |
          python - <<'PY'
          import glob, yaml
          for f in glob.glob('tiago_exam/config/*.yaml') + glob.glob('maps/*.yaml'):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f'{f} OK')
          PY

      - name: Check map files are consistent
        run: |
          python - <<'PY'
          import os, yaml
          meta = yaml.safe_load(open('maps/map.yaml'))
          image = os.path.join('maps', meta['image'])
          assert os.path.isfile(image), f'map.yaml references missing image: {image}'
          print(f"{image} present, resolution {meta['resolution']} m/cell")
          PY
